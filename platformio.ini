; ============================================================================
;  PlatformIO project configuration
;  ---------------------------------------------------------------------------
;  FT-847 CAT controller on ESP32 "Cheap Yellow Display" (CYD, ESP32-2432S028R)
;
;  Board   : ESP32-2432S028R  (ESP32-WROOM-32, 2.8" 240x320 TFT + XPT2046 touch)
;  Display : ILI9341 (variant "ILI9341_2") on HSPI
;  Touch   : XPT2046 on a SEPARATE SPI bus (VSPI) -> dedicated library
;
;  NOTE: the whole TFT_eSPI configuration is defined here in "build_flags".
;        You do NOT need to edit the library's User_Setup.h file.
; ============================================================================

[platformio]
default_envs = cyd

[env:cyd]
; Tested with espressif32@7.1.3 (arduino-esp32 core 2.x)
platform      = espressif32@^7.1.3
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
lib_ldf_mode  = deep

; ----------------------------------------------------------------------------
;  Libraries
; ----------------------------------------------------------------------------
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; ----------------------------------------------------------------------------
;  TFT_eSPI configuration for the CYD (ESP32-2432S028R)
;  Defining USER_SETUP_LOADED skips the library's own User_Setup.h, so all
;  settings below are used instead. See Bodmer/TFT_eSPI User_Setup_Select.h.
; ----------------------------------------------------------------------------
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DUSE_HSPI_PORT=1
    ; TFT_eSPI's built-in touch is intentionally NOT used (the CYD touch is on a
    ; separate SPI bus), so silence the related "TOUCH_CS not defined" warning.
    -DDISABLE_ALL_LIBRARY_WARNINGS=1

; ----------------------------------------------------------------------------
;  Serial monitor (USB debug / command line)
; ----------------------------------------------------------------------------
monitor_filters = default, time
